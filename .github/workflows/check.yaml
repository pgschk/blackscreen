name: check

# Pull requests: lint the workflows, and run the same build, HTTP/2 check
# and Trivy gate as build.yaml without logging in or publishing anything.
on:
  pull_request:

env:
  IMAGE: blackscreen:pr
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.76.2

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The image includes shellcheck, so run: scripts are checked too
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          file: Containerfile
          load: true
          tags: ${{ env.IMAGE }}
          provenance: false
          sbom: false
      - name: Check that HTTP/2 is off
        run: |
          if docker run --rm --entrypoint grep "$IMAGE" -rnw http2 /etc/nginx; then
            echo "::error::http2 is enabled in the nginx config; vex/openvex.json is no longer true"
            exit 1
          fi
      # A local image has no registry digest, so VEX statements naming the
      # ghcr.io image don't match here; build.yaml scans the pushed digest
      - name: Scan with Trivy
        run: >-
          trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
          --vex vex/openvex.json --ignorefile .trivyignore.yaml --show-suppressed "$IMAGE"
