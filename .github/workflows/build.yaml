name: build

# Images are published only from main and from GitHub releases:
#   push to main          -> :main (rolling)
#   release v1.0.0        -> :v1.0.0, :v1.0, :v1, :latest
# :latest follows the newest non-prerelease release (the README offers it).
# The image is pushed by digest first. Tags only move once it passed the
# Trivy scan and is signed, with provenance and a CycloneDX SBOM attached.
# Trivy skips findings that vex/openvex.json marks "not affected" and
# accepted risks in .trivyignore.yaml (version-scoped, with an end date).
# The base image is pinned by digest; Renovate opens PRs for updates.
# scan.yaml rescans the published images weekly.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/pgschk/blackscreen
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.76.2

jobs:
  build:
    # Manual runs publish only from main
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern=v{{major}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          file: Containerfile
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: false # CycloneDX SBOM from Trivy below, signed with cosign
      # vex/openvex.json says the image is not affected by nginx HTTP/2 bugs
      # because HTTP/2 is off; keep that true
      - name: Check that HTTP/2 is off
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          if docker run --rm --entrypoint grep "$REF" -rnw http2 /etc/nginx; then
            echo "::error::http2 is enabled in the nginx config; vex/openvex.json is no longer true"
            exit 1
          fi
      - name: Scan with Trivy
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: >-
          trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
          --vex vex/openvex.json --ignorefile .trivyignore.yaml --show-suppressed "$REF"
      - name: Sign
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: Attach signed SBOM
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          trivy image --format cyclonedx --output sbom.cdx.json "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
      - name: Tag
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r tag; do [ -n "$tag" ] && args+=(--tag "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$REF"
